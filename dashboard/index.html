<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes — AI Shopping Assistant</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface-2: #1a1a26;
    --surface-3: #21212f;
    --border: #2a2a3a;
    --text: #e4e4ef;
    --text-dim: #8888a0;
    --text-dimmer: #5c5c70;
    --accent: #00d4aa;
    --accent-glow: #00d4aa33;
    --red: #ff4466;
    --yellow: #ffcc00;
    --green: #00cc88;
    --blue: #4488ff;
    --orange: #ff9933;
  }

  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }
  button { font-family: inherit; cursor: pointer; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ══════════════ HEADER ══════════════ */
  header {
    flex-shrink: 0;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px;
    background: rgba(10,10,15,0.9);
    backdrop-filter: blur(12px);
  }
  .logo-block { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #4488ff);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #06060a; font-size: 17px; flex-shrink: 0;
  }
  .logo-text { display: flex; flex-direction: column; line-height: 1.25; }
  .logo-text .name-row { display: flex; align-items: center; gap: 6px; font-size: 15.5px; font-weight: 800; }
  .online-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 8px var(--green); flex-shrink: 0;
    animation: pulseDot 1.8s infinite;
  }
  @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
  .logo-text .sub { font-size: 11.5px; color: var(--text-dim); }

  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .badge {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
    color: var(--accent); background: var(--accent-glow);
    padding: 5px 10px; border-radius: 6px; border: 1px solid var(--accent);
    white-space: nowrap;
  }

  /* ══════════════ CHAT AREA ══════════════ */
  .chat-scroll {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px 12px;
  }
  .chat-col { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 16px; }

  .welcome {
    text-align: center; color: var(--text-dim); padding: 60px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .welcome .icon { font-size: 42px; }
  .welcome h2 { color: var(--text); font-size: 20px; font-weight: 800; }
  .welcome p { font-size: 13.5px; max-width: 380px; line-height: 1.6; }

  .msg-row { display: flex; gap: 10px; max-width: 100%; animation: slideUp .25s ease; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.agent { justify-content: flex-start; }

  .avatar {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), #4488ff);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #06060a; font-size: 14px; margin-top: 2px;
  }

  .bubble-stack { display: flex; flex-direction: column; gap: 8px; max-width: 82%; }
  .msg-row.user .bubble-stack { align-items: flex-end; }

  .bubble {
    padding: 11px 15px; border-radius: 14px; font-size: 14px; line-height: 1.55;
    word-wrap: break-word;
  }
  .msg-row.agent .bubble { background: var(--surface-2); border-bottom-left-radius: 4px; }
  .msg-row.user .bubble { background: var(--accent); color: #06060a; font-weight: 500; border-bottom-right-radius: 4px; }

  .typing-bubble { display: flex; gap: 4px; align-items: center; padding: 13px 16px; }
  .typing-bubble span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); animation: bounce 1.2s infinite; }
  .typing-bubble span:nth-child(2) { animation-delay: .15s; }
  .typing-bubble span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity:.4 } 30% { transform: translateY(-4px); opacity:1 } }

  /* ── option buttons ── */
  .options-card { background: var(--surface-2); border-radius: 14px; border-bottom-left-radius: 4px; padding: 13px 15px; }
  .options-card .q { font-size: 14px; margin-bottom: 10px; }
  .options-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .option-btn {
    background: transparent; border: 1.5px solid var(--accent); color: var(--accent);
    padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; transition: all .15s;
  }
  .option-btn:hover:not(:disabled) { background: var(--accent-glow); }
  .option-btn:disabled { opacity: .4; cursor: default; }
  .option-btn.picked { background: var(--accent); color: #06060a; }

  /* ── product cards ── */
  .cards-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 8px; max-width: 100%; }
  .product-card {
    flex: 0 0 190px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;
  }
  .product-img {
    aspect-ratio: 1/1; width: 100%; position: relative;
    background: linear-gradient(135deg, hsl(var(--hue,200) 40% 18%), hsl(calc(var(--hue,200) + 40) 40% 12%));
    display: flex; align-items: center; justify-content: center;
  }
  .product-img img { width: 100%; height: 100%; object-fit: cover; }
  .img-fallback-text { display: none; font-size: 32px; font-weight: 800; color: rgba(255,255,255,.25); }
  .product-img.img-fallback .img-fallback-text { display: flex; }
  .bulk-badge {
    position: absolute; top: 6px; left: 6px; background: var(--accent); color: #06060a;
    font-size: 9.5px; font-weight: 700; padding: 2px 6px; border-radius: 5px;
  }
  .product-body { padding: 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .product-merchant { font-size: 10px; color: #aa66ff; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; }
  .product-name { font-size: 12.5px; font-weight: 600; line-height: 1.3; min-height: 32px; }
  .product-price { font-size: 15px; font-weight: 800; margin-top: 2px; }
  .buy-now-btn {
    margin-top: 6px; width: 100%; padding: 7px; border-radius: 7px; border: none;
    background: var(--accent); color: #06060a; font-size: 12px; font-weight: 700; transition: filter .15s;
  }
  .buy-now-btn:hover { filter: brightness(1.1); }
  .buy-now-btn:disabled { opacity: .5; }

  /* ── comparison card ── */
  .compare-wrap { display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); border-radius: 14px; border-bottom-left-radius: 4px; padding: 13px 15px; }
  .compare-title { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .4px; font-weight: 700; }
  .compare-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--surface-3); border-radius: 9px; padding: 10px 12px;
    border: 1px solid var(--border);
  }
  .compare-row.best { border-color: var(--accent); }
  .compare-left { display: flex; flex-direction: column; gap: 2px; }
  .compare-left .cname { font-size: 13px; font-weight: 600; }
  .compare-left .cmerchant { font-size: 11px; color: #aa66ff; font-weight: 700; }
  .compare-right { display: flex; align-items: center; gap: 8px; }
  .compare-right .cprice { font-size: 15px; font-weight: 800; }
  .best-tag { font-size: 9.5px; font-weight: 700; color: #06060a; background: var(--accent); padding: 2px 7px; border-radius: 5px; }

  /* ── order summary card ── */
  .order-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; border-bottom-left-radius: 4px; padding: 15px; min-width: 280px; }
  .order-card h4 { font-size: 13.5px; font-weight: 700; margin-bottom: 8px; }
  .order-line { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-dim); padding: 3px 0; }
  .order-total-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
  .order-total-row .lbl { font-size: 12.5px; color: var(--text-dim); }
  .order-total-row .val { font-size: 19px; font-weight: 800; color: var(--accent); font-family: 'JetBrains Mono', monospace; }
  .savings-line { font-size: 11.5px; color: var(--green); margin-top: 4px; }
  .pay-btn {
    margin-top: 12px; width: 100%; padding: 11px; border-radius: 9px; border: none;
    background: var(--accent); color: #06060a; font-weight: 700; font-size: 13.5px; transition: all .15s;
  }
  .pay-btn:hover:not(:disabled) { filter: brightness(1.1); box-shadow: 0 0 16px var(--accent-glow); }
  .pay-btn:disabled { opacity: .5; }
  .order-status-note { font-size: 11.5px; color: var(--red); margin-top: 8px; }

  /* ── payment status card ── */
  .payment-card { border-radius: 14px; border-bottom-left-radius: 4px; padding: 16px; min-width: 260px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .payment-card.success { background: linear-gradient(135deg,#0d1f17,#0d171f); border: 1px solid var(--accent); }
  .payment-card.failed { background: #1f0d0d; border: 1px solid var(--red); }
  .payment-icon { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .payment-card.success .payment-icon { background: var(--accent); color: #06060a; }
  .payment-card.failed .payment-icon { background: var(--red); color: #06060a; }
  .payment-card .ptitle { font-weight: 700; font-size: 14px; }
  .payment-card .pid { font-size: 11px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; word-break: break-all; }
  .retry-btn {
    margin-top: 4px; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--red);
    background: transparent; color: var(--red); font-size: 12.5px; font-weight: 600;
  }

  /* ══════════════ INPUT AREA ══════════════ */
  .input-bar { flex-shrink: 0; padding: 14px 16px 18px; display: flex; justify-content: center; }
  .input-inner {
    width: 100%; max-width: 720px; display: flex; align-items: flex-end; gap: 8px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 16px;
    padding: 8px 8px 8px 16px; transition: border-color .2s;
  }
  .input-inner:focus-within { border-color: var(--accent); }
  .input-inner textarea {
    flex: 1; background: none; border: none; outline: none; resize: none;
    color: var(--text); font-family: inherit; font-size: 14.5px; line-height: 1.5;
    max-height: 120px; padding: 8px 0;
  }
  .input-inner textarea::placeholder { color: var(--text-dimmer); }

  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px; border: none; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
    background: var(--surface-3); color: var(--text-dim); transition: all .15s;
  }
  .icon-btn:hover:not(:disabled) { color: var(--text); background: #2a2a3a; }
  .icon-btn.send { background: var(--accent); color: #06060a; }
  .icon-btn.send:hover:not(:disabled) { filter: brightness(1.1); }
  .icon-btn:disabled { opacity: .4; cursor: not-allowed; }
  .icon-btn.mic.listening {
    background: var(--red); color: #fff;
    animation: micPulse 1.1s infinite;
  }
  @keyframes micPulse {
    0% { box-shadow: 0 0 0 0 rgba(255,68,102,.6); }
    70% { box-shadow: 0 0 0 12px rgba(255,68,102,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,68,102,0); }
  }

  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 11px 18px; border-radius: 10px; font-size: 13px; z-index: 600; opacity: 0;
    transition: all .25s; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ══════════════ VOICE MODE TOGGLE ══════════════ */
  .voice-toggle {
    display: flex; align-items: center; gap: 6px;
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600;
    color: var(--text-dim); background: var(--surface-3);
    padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border);
    white-space: nowrap; transition: all .15s;
  }
  .voice-toggle .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dimmer); flex-shrink: 0; }
  .voice-toggle.on { color: var(--accent); background: var(--accent-glow); border-color: var(--accent); }
  .voice-toggle.on .dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

  /* ══════════════ SPEAKER / REPLAY BUTTON ══════════════ */
  .bubble-with-speaker { display: flex; align-items: flex-start; gap: 2px; }
  .speak-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 7px; border: none; background: transparent;
    color: var(--text-dim); font-size: 12.5px; margin-top: 2px; flex-shrink: 0; transition: all .15s;
  }
  .speak-btn:hover { color: var(--accent); background: var(--accent-glow); }
  .speak-btn.speaking { color: var(--accent); animation: speakPulse 1s infinite; }
  @keyframes speakPulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  /* ══════════════ PER-MESSAGE AVATAR STATES ══════════════ */
  .avatar.thinking { animation: avatarThinking 1.2s infinite; }
  @keyframes avatarThinking { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
  .avatar.speaking { animation: avatarSpeak 1s infinite; }
  @keyframes avatarSpeak {
    0% { box-shadow: 0 0 0 0 rgba(0,212,170,.6); }
    70% { box-shadow: 0 0 0 8px rgba(0,212,170,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,212,170,0); }
  }

  /* ══════════════ CENTRAL AGENT AVATAR ══════════════ */
  .central-avatar-wrap { flex-shrink: 0; display: flex; justify-content: center; padding: 18px 0 2px; }
  .central-avatar {
    width: 60px; height: 60px; border-radius: 50%; position: relative;
    background: linear-gradient(135deg, var(--accent), #4488ff);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #06060a; font-size: 24px;
  }
  .central-avatar .ring {
    position: absolute; inset: -7px; border-radius: 50%; border: 2px solid transparent; opacity: 0;
  }
  .central-avatar.idle .ring { opacity: 0; }
  .central-avatar.speaking .ring { border-color: var(--accent); animation: ringPulse 1.3s infinite; }
  .central-avatar.listening .ring { border-color: var(--red); animation: ringPulse .9s infinite; }
  @keyframes ringPulse {
    0% { transform: scale(.82); opacity: .9; }
    100% { transform: scale(1.4); opacity: 0; }
  }
  .central-avatar.thinking .ring {
    opacity: 1; border-style: dashed; border-color: var(--yellow);
    animation: ringSpin 1s linear infinite;
  }
  @keyframes ringSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* ══════════════ SPLIT LAYOUT ══════════════ */
  .main-layout { flex: 1; display: flex; min-height: 0; overflow: hidden; }
  .chat-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  /* ══════════════ AGENT NETWORK PANEL ══════════════ */
  .network-panel {
    width: 380px; flex-shrink: 0; min-height: 0;
    border-left: 1px solid var(--border); background: var(--surface);
    display: flex; flex-direction: column;
  }
  .network-panel-header {
    flex-shrink: 0; padding: 13px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .np-title { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .np-close {
    display: none; width: 28px; height: 28px; border-radius: 8px; border: none;
    background: var(--surface-3); color: var(--text-dim); font-size: 13px; align-items: center; justify-content: center;
  }

  .network-viz { position: relative; width: 100%; aspect-ratio: 1.6/1; max-height: 230px; flex-shrink: 0; padding: 10px 0; }
  .net-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .net-line { stroke: var(--border); stroke-width: 1; vector-effect: non-scaling-stroke; transition: stroke .3s, opacity .3s; }
  .net-line.active { stroke-width: 2; animation: linePulse 1s infinite; }
  .net-line.active.blue { stroke: var(--blue); }
  .net-line.active.orange { stroke: var(--orange); }
  .net-line.active.yellow { stroke: var(--yellow); }
  .net-line.active.green { stroke: var(--green); }
  .net-line.active.red { stroke: var(--red); }
  @keyframes linePulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }

  .net-node {
    position: absolute; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 3px; width: 52px;
  }
  .net-node-icon {
    width: 30px; height: 30px; border-radius: 50%; background: var(--surface-3);
    border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: var(--text-dim); transition: all .3s; flex-shrink: 0;
  }
  .net-node.buyer .net-node-icon {
    width: 36px; height: 36px; font-size: 14px;
    background: linear-gradient(135deg, var(--accent), var(--blue)); color: #06060a; border-color: transparent;
  }
  .net-node-label {
    font-size: 8.5px; color: var(--text-dimmer); text-align: center; line-height: 1.2;
    max-width: 58px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .net-node-agent-badge {
    font-size: 7px; font-weight: 700; text-align: center; line-height: 1.2;
    max-width: 62px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--text-dimmer); opacity: .85;
  }
  .net-node.active .net-node-icon { transform: scale(1.18); }
  .net-node.active.blue .net-node-icon { border-color: var(--blue); box-shadow: 0 0 14px var(--blue); color: var(--blue); }
  .net-node.active.orange .net-node-icon { border-color: var(--orange); box-shadow: 0 0 14px var(--orange); color: var(--orange); }
  .net-node.active.yellow .net-node-icon { border-color: var(--yellow); box-shadow: 0 0 14px var(--yellow); color: var(--yellow); }
  .net-node.active.green .net-node-icon { border-color: var(--green); box-shadow: 0 0 14px var(--green); color: var(--green); }
  .net-node.active.red .net-node-icon { border-color: var(--red); box-shadow: 0 0 14px var(--red); color: var(--red); }

  .protocol-feed { flex: 1; overflow-y: auto; padding: 4px 14px 14px; display: flex; flex-direction: column-reverse; gap: 8px; }
  .protocol-idle {
    text-align: center; color: var(--text-dimmer); padding: 34px 10px 10px;
    display: flex; flex-direction: column; gap: 8px; align-items: center;
  }
  .protocol-idle .idle-icon { font-size: 26px; opacity: .5; }
  .protocol-idle p { font-size: 12.5px; }

  .pm-card {
    border-left: 3px solid var(--border); background: var(--surface-2); border-radius: 8px;
    padding: 9px 11px; opacity: 0; transform: translateY(-14px);
    transition: opacity .3s ease, transform .3s ease;
  }
  .pm-card.show { opacity: 1; transform: translateY(0); }
  .pm-card.blue { border-left-color: var(--blue); }
  .pm-card.orange { border-left-color: var(--orange); }
  .pm-card.yellow { border-left-color: var(--yellow); }
  .pm-card.green { border-left-color: var(--green); }
  .pm-card.red { border-left-color: var(--red); }
  .pm-card.pm-glow.blue { box-shadow: 0 0 14px rgba(68,136,255,.35); }
  .pm-card.pm-glow.green { box-shadow: 0 0 14px rgba(0,204,136,.35); }
  .pm-card.pm-glow.red { box-shadow: 0 0 14px rgba(255,68,102,.35); }
  .pm-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 3px; }
  .pm-type { font-weight: 700; font-size: 10.5px; }
  .pm-time { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: var(--text-dimmer); flex-shrink: 0; }
  .pm-route { font-size: 10px; color: var(--text-dim); margin-bottom: 3px; }
  .pm-arrow { color: var(--text-dimmer); margin: 0 3px; }
  .pm-summary { font-size: 11.5px; line-height: 1.4; }

  .pm-agent-badge {
    display: inline-flex; align-items: center; font-size: 9px; font-weight: 700;
    padding: 1px 6px; border-radius: 999px; margin-left: 4px; white-space: nowrap;
  }
  .pm-agent-badge.llm { background: rgba(170,102,255,.18); color: #c9a3ff; }
  .pm-agent-badge.rule { background: var(--surface-3); color: var(--text-dimmer); }

  .pm-reasoning { margin-top: 6px; }
  .pm-reasoning summary {
    font-size: 10.5px; font-weight: 600; color: #c9a3ff; cursor: pointer; list-style: none;
    display: flex; align-items: center; gap: 4px;
  }
  .pm-reasoning summary::-webkit-details-marker { display: none; }
  .pm-reasoning summary::before { content: '▸'; font-size: 9px; transition: transform .15s; }
  .pm-reasoning[open] summary::before { transform: rotate(90deg); }
  .pm-reasoning-body {
    font-size: 11px; line-height: 1.5; color: var(--text-dim); margin-top: 4px;
    padding: 8px 10px; background: var(--surface-3); border-radius: 8px;
    border-left: 2px solid #aa66ff;
  }

  /* ══════════════ MOBILE NETWORK OVERLAY ══════════════ */
  .mobile-network-btn {
    display: none; position: fixed; bottom: 90px; right: 16px; z-index: 400;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 16px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
    box-shadow: 0 6px 20px rgba(0,0,0,.45); align-items: center; gap: 6px;
  }

  @media (max-width: 900px) {
    .network-panel {
      position: fixed; inset: 0; z-index: 500; width: 100%;
      transform: translateX(100%); transition: transform .3s ease;
    }
    .network-panel.open { transform: translateX(0); }
    .np-close { display: flex; }
    .mobile-network-btn { display: flex; }
  }

  @media (max-width: 600px) {
    .product-card { flex: 0 0 155px; }
    header { padding: 12px 14px; }
    .badge { display: none; }
    .voice-toggle span:not(.dot) { display: none; }
  }

  /* ══════════════ ELEVENLABS VOICE AGENT BUTTON ══════════════ */
  elevenlabs-convai { display: none; }
  .voice-agent-btn {
    position: fixed; bottom: 24px; right: 24px; z-index: 700;
    display: flex; align-items: center; gap: 9px;
    padding: 13px 20px 13px 16px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-size: 13.5px; font-weight: 700;
    box-shadow: 0 8px 28px rgba(0,0,0,.5); transition: all .2s;
  }
  .voice-agent-btn:hover:not(:disabled) { border-color: var(--accent); box-shadow: 0 8px 28px rgba(0,212,170,.25); }
  .voice-agent-btn:disabled { opacity: .5; cursor: not-allowed; }
  .voice-agent-btn .vab-orb {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--blue));
    display: flex; align-items: center; justify-content: center; font-size: 13px;
  }
  .voice-agent-btn.active {
    border-color: var(--accent); background: var(--accent-glow); color: var(--accent);
  }
  .voice-agent-btn.active .vab-orb { animation: avatarSpeak 1s infinite; }

  @media (max-width: 900px) {
    .voice-agent-btn { bottom: 148px; right: 16px; }
  }
  @media (max-width: 600px) {
    .voice-agent-btn { padding: 11px 16px 11px 12px; font-size: 12.5px; }
    .voice-agent-btn span.vab-label { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-block">
    <div class="logo-icon">H</div>
    <div class="logo-text">
      <div class="name-row"><span class="online-dot"></span>Hermes</div>
      <div class="sub" id="storeCountText">Connecting to stores…</div>
    </div>
  </div>
  <div class="header-right">
    <button class="voice-toggle" id="voiceToggle" onclick="toggleVoiceMode()" title="Toggle spoken responses">
      <span class="dot"></span><span id="voiceToggleLabel">VOICE MODE: OFF</span>
    </button>
    <span class="badge">RAZORPAY TEST MODE</span>
  </div>
</header>

<div class="main-layout">
  <div class="chat-panel">
    <div class="central-avatar-wrap">
      <div class="central-avatar idle" id="centralAvatar">
        <span class="core">H</span>
        <span class="ring"></span>
      </div>
    </div>

    <div class="chat-scroll" id="chatScroll">
      <div class="chat-col" id="chatCol">
        <div class="welcome" id="welcome">
          <div class="icon">🛍️</div>
          <h2>Hi, I'm Hermes</h2>
          <p>Tell me what you're looking for and I'll find it, negotiate the best price, and check you out — right here in chat. Try "I want to buy a shirt" or just say hi.</p>
        </div>
      </div>
    </div>

    <div class="input-bar">
      <div class="input-inner">
        <textarea id="chatInput" rows="1" placeholder="Message Hermes…"></textarea>
        <button class="icon-btn mic" id="micBtn" title="Click to talk, or press and hold" onpointerdown="micPointerDown(event)" onpointerup="micPointerUp(event)" onpointerleave="micPointerCancel(event)">🎤</button>
        <button class="icon-btn send" id="sendBtn" title="Send" onclick="submitChat()">➤</button>
      </div>
    </div>
  </div>

  <aside class="network-panel" id="networkPanel">
    <div class="network-panel-header">
      <span class="np-title">🔗 Agent Network</span>
      <button class="np-close" id="npClose" onclick="closeMobileNetwork()" title="Close">✕</button>
    </div>
    <div class="network-viz" id="networkViz"></div>
    <div class="protocol-feed" id="protocolFeed">
      <div class="protocol-idle" id="protocolIdle">
        <div class="idle-icon">🛰️</div>
        <p>Waiting for a shopping request…</p>
      </div>
    </div>
  </aside>
</div>

<button class="mobile-network-btn" id="mobileNetworkBtn" onclick="openMobileNetwork()">🔗 View Agent Network</button>

<button class="voice-agent-btn" id="voiceAgentBtn" onclick="startVoiceAgent()" disabled title="Start a live voice conversation with Hermes">
  <span class="vab-orb">🎙️</span><span class="vab-label" id="voiceAgentLabel">Talk to Hermes</span>
</button>
<elevenlabs-convai id="elevenlabsWidget"></elevenlabs-convai>

<div class="toast" id="toast"></div>

<script>
const API = window.location.origin;
let sessionId = null;
let razorpayKeyId = null;
let isRunning = false;
let lastOrderSummary = null;

/* ═══════════════════════ INIT ═══════════════════════ */
async function init() {
  autosizeInput();
  loadStoreCount();
  loadConfig();
  initVoice();
  initVoiceOutput();
  document.getElementById('chatInput').addEventListener('keydown', onChatKeydown);
  document.getElementById('chatInput').addEventListener('input', autosizeInput);
  initVoiceAgent();
}

async function loadStoreCount() {
  try {
    const res = await fetch(`${API}/api/merchants`);
    const data = await res.json();
    document.getElementById('storeCountText').textContent = `Connected to ${data.total} store${data.total === 1 ? '' : 's'}`;
    sendWelcomeMessage(data.total);
    buildNetwork(data.merchants || []);
  } catch (e) {
    document.getElementById('storeCountText').textContent = 'Store connection unavailable';
  }
}

function sendWelcomeMessage(total) {
  const text = `Hey! I'm Hermes, your AI shopping assistant. I'm connected to ${total} store${total === 1 ? '' : 's'}. Tell me what you're looking for — or click the mic and talk to me!`;
  renderAgentMessage({ type: 'text', content: text });
}

async function loadConfig() {
  try {
    const res = await fetch(`${API}/api/config`);
    const data = await res.json();
    razorpayKeyId = data.key_id;
  } catch (e) { /* checkout will show an error if this never loads */ }
}

function autosizeInput() {
  const el = document.getElementById('chatInput');
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function onChatKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitChat(); }
}

/* ═══════════════════════ CHAT CORE ═══════════════════════ */
function removeWelcome() {
  const w = document.getElementById('welcome');
  if (w) w.remove();
}

function addUserBubble(text) {
  removeWelcome();
  const col = document.getElementById('chatCol');
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `<div class="bubble-stack"><div class="bubble">${escapeHtml(text)}</div></div>`;
  col.appendChild(row);
  scrollToBottom();
}

function addTypingIndicator() {
  setAvatarState('thinking');
  const col = document.getElementById('chatCol');
  const row = document.createElement('div');
  row.className = 'msg-row agent';
  row.id = 'typingRow';
  row.innerHTML = `<div class="avatar thinking">H</div><div class="bubble-stack"><div class="bubble typing-bubble"><span></span><span></span><span></span></div></div>`;
  col.appendChild(row);
  scrollToBottom();
}

function removeTypingIndicator() {
  document.getElementById('typingRow')?.remove();
}

function scrollToBottom() {
  const scroller = document.getElementById('chatScroll');
  requestAnimationFrame(() => { scroller.scrollTop = scroller.scrollHeight; });
}

function escapeHtml(s) {
  const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML;
}

async function submitChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || isRunning) return;
  input.value = '';
  autosizeInput();
  await sendMessage(text);
}

async function sendMessage(text) {
  if (isRunning) return;
  isRunning = true;
  stopSpeaking();
  document.getElementById('sendBtn').disabled = true;

  if (!text.startsWith('__BUY_NOW__:')) addUserBubble(text);
  addTypingIndicator();

  try {
    const res = await fetch(`${API}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });
    const data = await res.json();
    sessionId = data.session_id;
    removeTypingIndicator();
    setAvatarState('idle');
    (data.messages || []).forEach(renderAgentMessage);
    playProtocolMessages(data.protocol_messages || []);
  } catch (e) {
    removeTypingIndicator();
    renderAgentMessage({ type: 'text', content: `Something went wrong: ${e.message}` });
  } finally {
    isRunning = false;
    document.getElementById('sendBtn').disabled = false;
  }
}

/* ═══════════════════════ RENDERING RICH MESSAGES ═══════════════════════ */
function agentRow(innerHtml) {
  removeWelcome();
  const col = document.getElementById('chatCol');
  const row = document.createElement('div');
  row.className = 'msg-row agent';
  row.innerHTML = `<div class="avatar">H</div><div class="bubble-stack">${innerHtml}</div>`;
  col.appendChild(row);
  scrollToBottom();
  return row;
}

function renderAgentMessage(msg) {
  const type = msg.type, content = msg.content;
  if (type === 'text') {
    const row = agentRow(`
      <div class="bubble-with-speaker">
        <div class="bubble">${escapeHtml(content)}</div>
        ${TTS_SUPPORTED ? `<button class="speak-btn" onclick="speakFromButton(this)" title="Play voice">🔊</button>` : ''}
      </div>
    `);
    const btn = row.querySelector('.speak-btn');
    const avatarEl = row.querySelector('.avatar');
    if (btn) btn.dataset.text = content || '';
    if (voiceModeEnabled) speakText(content, btn, avatarEl);
  } else if (type === 'options') {
    renderOptions(content);
  } else if (type === 'product_cards') {
    renderProductCards(content);
  } else if (type === 'comparison') {
    renderComparison(content);
  } else if (type === 'order_summary') {
    renderOrderSummary(content);
  } else if (type === 'payment_status') {
    renderPaymentStatus(content);
  }
}

function hueFor(name) {
  let h = 0;
  for (let i = 0; i < (name || '').length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  return h;
}

function renderOptions(content) {
  const row = agentRow(`
    <div class="options-card">
      <div class="q">${escapeHtml(content.question || '')}</div>
      <div class="options-row">
        ${(content.options || []).map(opt => `<button class="option-btn" onclick="pickOption(this, '${opt.replace(/'/g, "\\'")}')">${escapeHtml(opt)}</button>`).join('')}
      </div>
    </div>
  `);
}

function pickOption(btnEl, value) {
  const row = btnEl.closest('.options-row');
  row.querySelectorAll('.option-btn').forEach(b => { b.disabled = true; });
  btnEl.classList.add('picked');
  sendMessage(value);
}

function renderProductCards(products) {
  agentRow(`
    <div class="cards-scroll">
      ${products.map(p => productCardHtml(p)).join('')}
    </div>
  `);
}

function productCardHtml(p) {
  const escName = (p.name || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
  return `
    <div class="product-card">
      <div class="product-img" style="--hue:${hueFor(p.name)}">
        <img src="${p.image_url}" alt="${escName}" loading="lazy"
             onerror="this.style.display='none'; this.parentElement.classList.add('img-fallback')">
        <span class="img-fallback-text">${(p.name || '?').charAt(0)}</span>
        ${p.bulk_discount_pct ? `<span class="bulk-badge">Up to ${p.bulk_discount_pct}% off</span>` : ''}
      </div>
      <div class="product-body">
        <div class="product-merchant">${escapeHtml(p.merchant || '')}</div>
        <div class="product-name">${escapeHtml(p.name || '')}</div>
        <div class="product-price">₹${(p.price || 0).toLocaleString()}<span style="font-size:10.5px;color:var(--text-dim);font-weight:500"> /${p.unit || 'piece'}</span></div>
        <button class="buy-now-btn" onclick="buyNow('${p.id}', this)">Buy Now</button>
      </div>
    </div>
  `;
}

function buyNow(productId, btnEl) {
  btnEl.disabled = true;
  btnEl.textContent = 'Working…';
  sendMessage(`__BUY_NOW__:${productId}:1`);
}

function renderComparison(content) {
  const items = content.items || [];
  const cheapest = items.reduce((min, p) => (p.price < (min?.price ?? Infinity) ? p : min), null);
  agentRow(`
    <div class="compare-wrap">
      <div class="compare-title">Price Comparison</div>
      ${items.map(p => `
        <div class="compare-row ${p === cheapest ? 'best' : ''}">
          <div class="compare-left">
            <div class="cname">${escapeHtml(p.name)}</div>
            <div class="cmerchant">${escapeHtml(p.merchant)}</div>
          </div>
          <div class="compare-right">
            ${p === cheapest ? '<span class="best-tag">BEST PRICE</span>' : ''}
            <span class="cprice">₹${(p.price || 0).toLocaleString()}</span>
          </div>
        </div>
      `).join('')}
    </div>
  `);
}

function renderOrderSummary(content) {
  lastOrderSummary = content;
  const failed = content.payment_status !== 'success' || !content.checkout;
  const rowId = 'order-' + Math.random().toString(36).slice(2, 9);
  const row = agentRow(`
    <div class="order-card" id="${rowId}">
      <h4>Order Summary — ${escapeHtml(content.merchant || '')}</h4>
      ${(content.items || []).map(it => `
        <div class="order-line"><span>${escapeHtml(it.name)} × ${it.quantity}</span><span>₹${(it.total || 0).toLocaleString()}</span></div>
      `).join('')}
      <div class="order-total-row">
        <span class="lbl">Total</span>
        <span class="val">₹${(content.total || 0).toLocaleString()}</span>
      </div>
      ${content.discount ? `<div class="savings-line">You saved ₹${content.discount.toLocaleString()} (${content.savings_pct}%) through negotiation</div>` : ''}
      ${failed
        ? `<div class="order-status-note">Couldn't create the payment order — please try again.</div>`
        : `<button class="pay-btn" onclick='payForOrder(${JSON.stringify(content).replace(/'/g, "&apos;")}, this)'>Pay with Razorpay</button>`
      }
    </div>
  `);
}

/* ═══════════════════════ RAZORPAY CHECKOUT ═══════════════════════ */
function payForOrder(orderSummary, btnEl) {
  if (!razorpayKeyId) { showToast('Payment isn\'t ready yet — try again in a second.'); return; }
  stopSpeaking();
  btnEl.disabled = true;
  btnEl.textContent = 'Opening Razorpay…';

  const checkout = orderSummary.checkout;
  const options = {
    key: razorpayKeyId,
    amount: checkout.amount,
    currency: checkout.currency,
    order_id: checkout.order_id,
    name: 'Hermes Protocol',
    description: `AI Agent Commerce — ${orderSummary.merchant}`,
    prefill: { email: 'test@hermes.com' },
    theme: { color: '#00d4aa' },
    handler: async function (response) {
      try {
        const verifyRes = await fetch(`${API}/api/payment/verify`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            razorpay_order_id: response.razorpay_order_id,
            razorpay_payment_id: response.razorpay_payment_id,
            razorpay_signature: response.razorpay_signature,
          }),
        });
        const verifyData = await verifyRes.json();
        if (verifyRes.ok && verifyData.verified) {
          renderPaymentStatus({ status: 'success', payment_id: response.razorpay_payment_id, order_id: checkout.order_id, amount: orderSummary.total });
        } else {
          renderPaymentStatus({ status: 'failed', error: 'Signature verification failed', orderSummary });
        }
      } catch (e) {
        renderPaymentStatus({ status: 'failed', error: e.message, orderSummary });
      }
      btnEl.textContent = 'Paid ✓';
    },
    modal: {
      ondismiss: function () {
        btnEl.disabled = false;
        btnEl.textContent = 'Pay with Razorpay';
      }
    }
  };

  const rzp = new Razorpay(options);
  rzp.on('payment.failed', function (response) {
    renderPaymentStatus({ status: 'failed', error: response.error?.description, orderSummary });
    btnEl.disabled = false;
    btnEl.textContent = 'Pay with Razorpay';
  });
  rzp.open();
}

function retryPayment(orderSummaryJson) {
  const orderSummary = JSON.parse(orderSummaryJson);
  const fakeBtn = document.createElement('button');
  payForOrder(orderSummary, fakeBtn);
}

function renderPaymentStatus(content) {
  if (content.status === 'success') {
    agentRow(`
      <div class="payment-card success">
        <div class="payment-icon">✓</div>
        <div class="ptitle">Payment Successful</div>
        <div class="pid">Payment ID: ${escapeHtml(content.payment_id || '')}</div>
        <div class="pid">Order ID: ${escapeHtml(content.order_id || '')}</div>
      </div>
    `);
  } else {
    agentRow(`
      <div class="payment-card failed">
        <div class="payment-icon">✕</div>
        <div class="ptitle">Payment Failed</div>
        <div class="pid">${escapeHtml(content.error || 'The payment could not be completed.')}</div>
        ${content.orderSummary ? `<button class="retry-btn" onclick='retryPayment(${JSON.stringify(JSON.stringify(content.orderSummary))})'>Retry Payment</button>` : ''}
      </div>
    `);
  }
}

/* ═══════════════════════ VOICE INPUT (Web Speech API) ═══════════════════════ */
let recognition = null;
let silenceTimer = null;

function initVoice() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById('micBtn');
  if (!SpeechRecognition) { micBtn.style.display = 'none'; return; }

  recognition = new SpeechRecognition();
  recognition.lang = 'en-IN';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onresult = (e) => {
    let transcript = '';
    for (let i = 0; i < e.results.length; i++) transcript += e.results[i][0].transcript;
    document.getElementById('chatInput').value = transcript;
    autosizeInput();
    resetSilenceTimer();
  };
  recognition.onend = () => {
    micBtn.classList.remove('listening');
    setAvatarState('idle');
    clearTimeout(silenceTimer);
    const text = document.getElementById('chatInput').value.trim();
    if (text) submitChat();
  };
  recognition.onerror = () => {
    micBtn.classList.remove('listening');
    setAvatarState('idle');
    clearTimeout(silenceTimer);
  };
}

function resetSilenceTimer() {
  clearTimeout(silenceTimer);
  silenceTimer = setTimeout(() => { if (recognition) recognition.stop(); }, 2000);
}

function startListening() {
  if (!recognition) { showToast('Voice input isn\'t supported in this browser.'); return; }
  const micBtn = document.getElementById('micBtn');
  if (micBtn.classList.contains('listening') || micBtn.disabled) return;
  document.getElementById('chatInput').value = '';
  try {
    recognition.start();
    micBtn.classList.add('listening');
    setAvatarState('listening');
    resetSilenceTimer();
  } catch (e) { /* already started */ }
}

function stopListening() {
  if (recognition) recognition.stop();
}

function toggleMic() {
  const micBtn = document.getElementById('micBtn');
  if (micBtn.classList.contains('listening')) {
    stopListening();
  } else {
    startListening();
  }
}

/* ── hold-to-talk: quick tap = click-toggle, press-and-hold = talk-while-held ── */
let micPressTimer = null;
let micHoldMode = false;
const MIC_HOLD_THRESHOLD_MS = 300;

function micPointerDown(e) {
  e.preventDefault();
  micHoldMode = false;
  clearTimeout(micPressTimer);
  micPressTimer = setTimeout(() => {
    micHoldMode = true;
    startListening();
  }, MIC_HOLD_THRESHOLD_MS);
}

function micPointerUp(e) {
  e.preventDefault();
  clearTimeout(micPressTimer);
  if (micHoldMode) {
    stopListening();
    micHoldMode = false;
  } else {
    toggleMic();
  }
}

function micPointerCancel(e) {
  clearTimeout(micPressTimer);
  if (micHoldMode) {
    stopListening();
    micHoldMode = false;
  }
}

/* ═══════════════════════ VOICE OUTPUT (SpeechSynthesis) ═══════════════════════ */
const TTS_SUPPORTED = 'speechSynthesis' in window;
let voiceModeEnabled = false;
let preferredVoice = null;
let currentUtterance = null;
let currentSpeakBtn = null;

function initVoiceOutput() {
  if (!TTS_SUPPORTED) {
    const toggle = document.getElementById('voiceToggle');
    if (toggle) toggle.style.display = 'none';
    return;
  }
  const loadVoices = () => {
    const voices = speechSynthesis.getVoices();
    preferredVoice =
      voices.find(v => v.lang === 'en-IN' && /female/i.test(v.name)) ||
      voices.find(v => v.lang === 'en-IN') ||
      voices.find(v => /^en/i.test(v.lang) && /female/i.test(v.name)) ||
      voices.find(v => /^en/i.test(v.lang)) ||
      voices[0] || null;
  };
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function toggleVoiceMode() {
  voiceModeEnabled = !voiceModeEnabled;
  const btn = document.getElementById('voiceToggle');
  btn.classList.toggle('on', voiceModeEnabled);
  document.getElementById('voiceToggleLabel').textContent = `VOICE MODE: ${voiceModeEnabled ? 'ON' : 'OFF'}`;
  if (!voiceModeEnabled) stopSpeaking();
}

let speechQueue = [];

function stopSpeaking() {
  speechQueue = [];
  if (TTS_SUPPORTED) speechSynthesis.cancel();
  if (currentSpeakBtn) currentSpeakBtn.classList.remove('speaking');
  currentUtterance = null;
  currentSpeakBtn = null;
  document.getElementById('micBtn').disabled = false;
  setAvatarState('idle');
}

// A single agent turn can contain several text bubbles (e.g. one per item in a
// multi-item search). Queue them instead of cancelling in-flight speech, or every
// bubble but the last gets cut off before it's ever heard.
function speakText(text, btnEl, avatarEl) {
  if (!TTS_SUPPORTED || !text) return;
  speechQueue.push({ text, btnEl, avatarEl });
  if (!currentUtterance) playNextInQueue();
}

function playNextInQueue() {
  const next = speechQueue.shift();
  if (!next) {
    currentUtterance = null;
    currentSpeakBtn = null;
    document.getElementById('micBtn').disabled = false;
    setAvatarState('idle');
    return;
  }
  const { text, btnEl, avatarEl } = next;
  const utter = new SpeechSynthesisUtterance(text);
  if (preferredVoice) { utter.voice = preferredVoice; utter.lang = preferredVoice.lang; }
  else { utter.lang = 'en-IN'; }
  utter.rate = 1.0;
  utter.pitch = 1.0;
  currentUtterance = utter;
  currentSpeakBtn = btnEl || null;
  if (btnEl) btnEl.classList.add('speaking');
  if (avatarEl) avatarEl.classList.add('speaking');
  setAvatarState('speaking');
  document.getElementById('micBtn').disabled = true;
  const cleanup = () => {
    if (btnEl) btnEl.classList.remove('speaking');
    if (avatarEl) avatarEl.classList.remove('speaking');
    playNextInQueue();
  };
  utter.onend = cleanup;
  utter.onerror = cleanup;
  speechSynthesis.speak(utter);
}

function speakFromButton(btnEl) {
  if (currentSpeakBtn === btnEl && TTS_SUPPORTED && speechSynthesis.speaking) { stopSpeaking(); return; }
  stopSpeaking();
  const text = btnEl.dataset.text || '';
  const avatarEl = btnEl.closest('.msg-row')?.querySelector('.avatar');
  speakText(text, btnEl, avatarEl);
}

function setAvatarState(state) {
  const el = document.getElementById('centralAvatar');
  if (!el) return;
  el.classList.remove('idle', 'listening', 'thinking', 'speaking');
  el.classList.add(state);
}

/* ═══════════════════════ ELEVENLABS VOICE AGENT ═══════════════════════ */
// Real-time voice conversation via the ElevenLabs widget, wired to our own
// backend through client tools (the widget runs in the browser, so it can
// reach our localhost API — a server-side webhook tool from ElevenLabs'
// cloud could not). search_products drives the same /api/chat conversation
// session as text chat, so product cards / order summaries render here in
// the chat panel exactly as they do for typed messages; checkout reuses the
// existing Razorpay flow. Voice narrates, the screen shows the real thing.
let elWidget = null;
let voiceAgentActive = false;

async function initVoiceAgent() {
  elWidget = document.getElementById('elevenlabsWidget');
  const btn = document.getElementById('voiceAgentBtn');

  // Configure the client tools the agent can call. Must be attached before
  // the call starts — this event fires each time a conversation is initiated.
  elWidget.addEventListener('elevenlabs-convai:call', (event) => {
    event.detail.config.clientTools = {
      search_products: voiceSearchProducts,
      checkout: voiceCheckout,
    };
  });

  try {
    const res = await fetch(`${API}/api/voice-config`);
    const data = await res.json();
    if (data.voice_enabled && data.agent_id) {
      elWidget.setAttribute('agent-id', data.agent_id);
      await customElements.whenDefined('elevenlabs-convai');
      watchVoiceAgentState();
      btn.disabled = false;
    } else {
      btn.style.display = 'none';
    }
  } catch (e) {
    btn.style.display = 'none';
  }
}

// The widget's public custom-element API doesn't expose a startConversation()
// method or conversationStarted/Ended events in the currently shipped build —
// its call controls only exist as buttons inside its shadow DOM (the element
// itself stays display:none; we replace its visuals with our own button and
// the existing chat panel). We drive both the click and the active/inactive
// state off those shadow-DOM buttons directly.
function shadowButton(label) {
  if (!elWidget || !elWidget.shadowRoot) return null;
  return Array.from(elWidget.shadowRoot.querySelectorAll('button'))
    .find(b => b.getAttribute('aria-label') === label);
}

function watchVoiceAgentState() {
  if (!elWidget.shadowRoot) return;
  const sync = () => {
    const active = !!shadowButton('End');
    if (active === voiceAgentActive) return;
    voiceAgentActive = active;
    const btn = document.getElementById('voiceAgentBtn');
    const label = document.getElementById('voiceAgentLabel');
    if (active) {
      stopSpeaking();   // don't let browser TTS and the voice agent talk over each other
      stopListening();  // don't let the Web Speech mic and the voice agent listen at once
      document.getElementById('micBtn').disabled = true;
      btn.classList.add('active');
      label.textContent = 'End voice chat';
    } else {
      document.getElementById('micBtn').disabled = false;
      btn.classList.remove('active');
      label.textContent = 'Talk to Hermes';
    }
  };
  new MutationObserver(sync).observe(elWidget.shadowRoot, { childList: true, subtree: true });
}

function startVoiceAgent() {
  const endBtn = shadowButton('End');
  if (endBtn) { endBtn.click(); return; }
  const startBtn = shadowButton('Start a call');
  if (startBtn) startBtn.click();
}

// Client tool: the voice agent calls this to search our real catalogs. It
// reuses the same conversational session as text chat (same session_id), so
// negotiation/checkout state carries over between voice and typed turns.
async function voiceSearchProducts({ query }) {
  try {
    const res = await fetch(`${API}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: query, session_id: sessionId }),
    });
    const data = await res.json();
    sessionId = data.session_id;
    const messages = data.messages || [];
    messages.forEach(renderAgentMessage);
    playProtocolMessages(data.protocol_messages || []);
    return summarizeMessagesForVoice(messages);
  } catch (e) {
    return `The search failed: ${e.message}`;
  }
}

// Client tool: the voice agent calls this only after the user verbally
// confirms a purchase. It opens the exact same Razorpay modal the Buy Now /
// text-chat flow uses, for whichever order was last shown on screen.
async function voiceCheckout() {
  if (!lastOrderSummary) {
    return "There is no order ready to check out yet — search for and confirm a product first.";
  }
  const fakeBtn = document.createElement('button');
  payForOrder(lastOrderSummary, fakeBtn);
  return `Opening the Razorpay checkout window for ₹${(lastOrderSummary.total || 0).toLocaleString()} now. Tell the user to complete payment in that window.`;
}

// Collapse the same rich message types the chat panel renders into a short
// spoken summary, since the voice agent can only speak text back, not cards.
function summarizeMessagesForVoice(messages) {
  const parts = [];
  for (const msg of messages) {
    const c = msg.content;
    if (msg.type === 'text') {
      if (c) parts.push(c);
    } else if (msg.type === 'product_cards') {
      const items = (c || []).slice(0, 4).map(p => `${p.name} for ${Math.round(p.price || 0)} rupees at ${p.merchant}`);
      if (items.length) parts.push(`Found: ${items.join('; ')}.`);
    } else if (msg.type === 'comparison') {
      const items = (c?.items || []).map(p => `${p.name} at ${p.merchant} for ${Math.round(p.price || 0)} rupees`);
      if (items.length) parts.push(`Comparison: ${items.join('; ')}.`);
    } else if (msg.type === 'order_summary') {
      parts.push(`Order ready: ${(c.items || []).length} item(s), total ${Math.round(c.total || 0)} rupees. Ask the user to confirm before checking out.`);
    } else if (msg.type === 'payment_status') {
      parts.push(c.status === 'success' ? 'Payment succeeded.' : `Payment failed: ${c.error || 'unknown error'}.`);
    } else if (msg.type === 'options') {
      parts.push(`${c.question} Options: ${(c.options || []).join(', ')}.`);
    }
  }
  return parts.length ? parts.join(' ') : 'No matching products were found.';
}

/* ═══════════════════════ AGENT NETWORK VISUALIZATION ═══════════════════════ */
// Maps a protocol message "sender"/"receiver" display name (e.g. "FestKart",
// "Buyer Agent", "Razorpay") to the DOM node id used in the network viz.
let nodeIdByName = {};
let llmAgentNames = new Set();  // merchant display names running LLMMerchantAgent (e.g. "StyleBazaar")
const COLOR_CLASSES = ['blue', 'orange', 'yellow', 'green', 'red'];
const PM_STYLE = {
  'catalog.request':   { cls: 'blue',   glow: false, label: '📇 Catalog Request' },
  'catalog.response':  { cls: 'blue',   glow: false, label: '📇 Catalog Response' },
  'negotiate.offer':   { cls: 'orange', glow: false, label: '🤝 Offer' },
  'negotiate.counter': { cls: 'yellow', glow: false, label: '🔁 Counter' },
  'negotiate.accept':  { cls: 'green',  glow: false, label: '✅ Accepted' },
  'negotiate.reject':  { cls: 'red',    glow: false, label: '❌ Rejected' },
  'payment.initiate':  { cls: 'blue',   glow: true,  label: '💳 Payment Initiated' },
  'payment.success':   { cls: 'green',  glow: true,  label: '✅ Payment Success' },
  'payment.failed':    { cls: 'red',    glow: true,  label: '⚠️ Payment Failed' },
  'error':             { cls: 'red',    glow: false, label: '⚠️ Error' },
};

function buildNetwork(merchants) {
  nodeIdByName = { 'Buyer Agent': 'buyer', 'Razorpay': 'razorpay' };
  llmAgentNames = new Set(merchants.filter(m => m.is_llm_agent).map(m => m.name));
  const nodes = [
    { id: 'buyer', name: 'Buyer Agent', kind: 'buyer', icon: 'H' },
    ...merchants.map(m => ({
      id: m.id, name: m.name, kind: 'merchant', icon: (m.name || '?').charAt(0),
      agentBadge: m.is_llm_agent ? '🧠 LLM Agent' : '⚙️ Rule-based',
    })),
    { id: 'razorpay', name: 'Razorpay', kind: 'gateway', icon: '💳' },
  ];
  merchants.forEach(m => { nodeIdByName[m.name] = m.id; });

  const others = nodes.filter(n => n.kind !== 'buyer');
  const positions = { buyer: { x: 50, y: 50 } };
  // network-viz is wider than tall (aspect-ratio 1.6/1 in CSS), so 1% of width is
  // fewer px than 1% of height — shrink the x radius by that ratio to keep the ring
  // visually circular instead of bulging past the panel's edges.
  const RY = 36, RX = RY / 1.6;
  others.forEach((n, i) => {
    const angle = (2 * Math.PI * i / others.length) - Math.PI / 2;
    positions[n.id] = { x: 50 + RX * Math.cos(angle), y: 50 + RY * Math.sin(angle) };
  });

  const buyerPos = positions.buyer;
  const linesSvg = others.map(n => {
    const p = positions[n.id];
    return `<line id="line-${n.id}" class="net-line" x1="${buyerPos.x}" y1="${buyerPos.y}" x2="${p.x}" y2="${p.y}" />`;
  }).join('');

  const nodesHtml = nodes.map(n => {
    const p = positions[n.id];
    const title = n.agentBadge ? `${n.name} — ${n.agentBadge}` : n.name;
    return `<div class="net-node ${n.kind}" id="node-${n.id}" style="left:${p.x}%; top:${p.y}%;" title="${escapeHtml(title)}">
      <span class="net-node-icon">${escapeHtml(n.icon)}</span>
      <span class="net-node-label">${escapeHtml(n.name)}</span>
      ${n.agentBadge ? `<span class="net-node-agent-badge">${escapeHtml(n.agentBadge)}</span>` : ''}
    </div>`;
  }).join('');

  document.getElementById('networkViz').innerHTML =
    `<svg class="net-svg" viewBox="0 0 100 100" preserveAspectRatio="none">${linesSvg}</svg>${nodesHtml}`;
}

const highlightTimers = {};
function highlightNetworkLink(nodeId, msgType) {
  const style = PM_STYLE[msgType] || { cls: 'blue' };
  const line = document.getElementById(`line-${nodeId}`);
  const node = document.getElementById(`node-${nodeId}`);
  const buyerNode = document.getElementById('node-buyer');
  [line, node, buyerNode].forEach(el => {
    if (!el) return;
    COLOR_CLASSES.forEach(c => el.classList.remove(c));
    el.classList.add('active', style.cls);
  });
  clearTimeout(highlightTimers[nodeId]);
  highlightTimers[nodeId] = setTimeout(() => {
    [line, node, buyerNode].forEach(el => {
      if (!el) return;
      el.classList.remove('active');
      COLOR_CLASSES.forEach(c => el.classList.remove(c));
    });
  }, 2200);
}

function renderProtocolMessage(pm) {
  document.getElementById('protocolIdle')?.remove();
  const style = PM_STYLE[pm.type] || { cls: 'blue', glow: false, label: pm.type };
  const feed = document.getElementById('protocolFeed');
  const el = document.createElement('div');
  el.className = `pm-card ${style.cls}${style.glow ? ' pm-glow' : ''}`;

  // Badge only the seller's own negotiation response line (sender is the
  // merchant, not the buyer/gateway), so "Buyer Agent" offer lines and
  // catalog/payment lines never get an agent-type badge.
  const senderIsMerchant = pm.sender !== 'Buyer Agent' && pm.sender !== 'Razorpay' && pm.sender !== 'System';
  const isLlmAgent = !!(pm.details && pm.details.is_llm_agent) || (senderIsMerchant && llmAgentNames.has(pm.sender));
  const agentBadgeHtml = (senderIsMerchant && pm.type.startsWith('negotiate.'))
    ? (isLlmAgent
        ? `<span class="pm-agent-badge llm">🧠 LLM Agent</span>`
        : `<span class="pm-agent-badge rule">⚙️ Rule-based</span>`)
    : '';

  const reasoning = pm.details && pm.details.seller_reasoning;
  const reasoningHtml = reasoning ? `
    <details class="pm-reasoning">
      <summary>🧠 Seller's reasoning</summary>
      <div class="pm-reasoning-body">${escapeHtml(reasoning)}</div>
    </details>
  ` : '';

  el.innerHTML = `
    <div class="pm-top">
      <span class="pm-type">${style.label}</span>
      <span class="pm-time">${escapeHtml(pm.timestamp || '')}</span>
    </div>
    <div class="pm-route">${escapeHtml(pm.sender)} <span class="pm-arrow">→</span> ${escapeHtml(pm.receiver)} ${agentBadgeHtml}</div>
    <div class="pm-summary">${escapeHtml(pm.summary || '')}</div>
    ${reasoningHtml}
  `;
  feed.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));

  const otherName = pm.sender === 'Buyer Agent' ? pm.receiver : pm.sender;
  const nodeId = nodeIdByName[otherName];
  if (nodeId) highlightNetworkLink(nodeId, pm.type);
}

// Stagger message cards in so the feed reads like a live agent-to-agent conversation
// instead of dumping the whole turn's protocol trace in at once.
function playProtocolMessages(msgs) {
  msgs.forEach((pm, i) => setTimeout(() => renderProtocolMessage(pm), i * 260));
}

function openMobileNetwork() { document.getElementById('networkPanel').classList.add('open'); }
function closeMobileNetwork() { document.getElementById('networkPanel').classList.remove('open'); }

(function initNetworkSwipe() {
  const panel = document.getElementById('networkPanel');
  let startX = null;
  panel.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
  panel.addEventListener('touchend', e => {
    if (startX === null) return;
    if (e.changedTouches[0].clientX - startX > 70) closeMobileNetwork();
    startX = null;
  }, { passive: true });
})();

/* ═══════════════════════ MISC ═══════════════════════ */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

init();
</script>
