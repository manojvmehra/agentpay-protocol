<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentPay — AI Shopping Assistant</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface-2: #1a1a26;
    --surface-3: #21212f;
    --border: #2a2a3a;
    --text: #e4e4ef;
    --text-dim: #8888a0;
    --text-dimmer: #5c5c70;
    --accent: #00d4aa;
    --accent-glow: #00d4aa33;
    --red: #ff4466;
    --yellow: #ffcc00;
    --green: #00cc88;
  }

  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }
  button { font-family: inherit; cursor: pointer; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ══════════════ HEADER ══════════════ */
  header {
    flex-shrink: 0;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px;
    background: rgba(10,10,15,0.9);
    backdrop-filter: blur(12px);
  }
  .logo-block { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #4488ff);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #06060a; font-size: 17px; flex-shrink: 0;
  }
  .logo-text { display: flex; flex-direction: column; line-height: 1.25; }
  .logo-text .name-row { display: flex; align-items: center; gap: 6px; font-size: 15.5px; font-weight: 800; }
  .online-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 8px var(--green); flex-shrink: 0;
    animation: pulseDot 1.8s infinite;
  }
  @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
  .logo-text .sub { font-size: 11.5px; color: var(--text-dim); }

  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .badge {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
    color: var(--accent); background: var(--accent-glow);
    padding: 5px 10px; border-radius: 6px; border: 1px solid var(--accent);
    white-space: nowrap;
  }

  /* ══════════════ CHAT AREA ══════════════ */
  .chat-scroll {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px 12px;
  }
  .chat-col { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 16px; }

  .welcome {
    text-align: center; color: var(--text-dim); padding: 60px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .welcome .icon { font-size: 42px; }
  .welcome h2 { color: var(--text); font-size: 20px; font-weight: 800; }
  .welcome p { font-size: 13.5px; max-width: 380px; line-height: 1.6; }

  .msg-row { display: flex; gap: 10px; max-width: 100%; animation: slideUp .25s ease; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.agent { justify-content: flex-start; }

  .avatar {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), #4488ff);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #06060a; font-size: 14px; margin-top: 2px;
  }

  .bubble-stack { display: flex; flex-direction: column; gap: 8px; max-width: 82%; }
  .msg-row.user .bubble-stack { align-items: flex-end; }

  .bubble {
    padding: 11px 15px; border-radius: 14px; font-size: 14px; line-height: 1.55;
    word-wrap: break-word;
  }
  .msg-row.agent .bubble { background: var(--surface-2); border-bottom-left-radius: 4px; }
  .msg-row.user .bubble { background: var(--accent); color: #06060a; font-weight: 500; border-bottom-right-radius: 4px; }

  .typing-bubble { display: flex; gap: 4px; align-items: center; padding: 13px 16px; }
  .typing-bubble span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); animation: bounce 1.2s infinite; }
  .typing-bubble span:nth-child(2) { animation-delay: .15s; }
  .typing-bubble span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity:.4 } 30% { transform: translateY(-4px); opacity:1 } }

  /* ── option buttons ── */
  .options-card { background: var(--surface-2); border-radius: 14px; border-bottom-left-radius: 4px; padding: 13px 15px; }
  .options-card .q { font-size: 14px; margin-bottom: 10px; }
  .options-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .option-btn {
    background: transparent; border: 1.5px solid var(--accent); color: var(--accent);
    padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; transition: all .15s;
  }
  .option-btn:hover:not(:disabled) { background: var(--accent-glow); }
  .option-btn:disabled { opacity: .4; cursor: default; }
  .option-btn.picked { background: var(--accent); color: #06060a; }

  /* ── product cards ── */
  .cards-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 8px; max-width: 100%; }
  .product-card {
    flex: 0 0 190px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;
  }
  .product-img {
    aspect-ratio: 1/1; width: 100%; position: relative;
    background: linear-gradient(135deg, hsl(var(--hue,200) 40% 18%), hsl(calc(var(--hue,200) + 40) 40% 12%));
    display: flex; align-items: center; justify-content: center;
  }
  .product-img img { width: 100%; height: 100%; object-fit: cover; }
  .img-fallback-text { display: none; font-size: 32px; font-weight: 800; color: rgba(255,255,255,.25); }
  .product-img.img-fallback .img-fallback-text { display: flex; }
  .bulk-badge {
    position: absolute; top: 6px; left: 6px; background: var(--accent); color: #06060a;
    font-size: 9.5px; font-weight: 700; padding: 2px 6px; border-radius: 5px;
  }
  .product-body { padding: 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .product-merchant { font-size: 10px; color: #aa66ff; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; }
  .product-name { font-size: 12.5px; font-weight: 600; line-height: 1.3; min-height: 32px; }
  .product-price { font-size: 15px; font-weight: 800; margin-top: 2px; }
  .buy-now-btn {
    margin-top: 6px; width: 100%; padding: 7px; border-radius: 7px; border: none;
    background: var(--accent); color: #06060a; font-size: 12px; font-weight: 700; transition: filter .15s;
  }
  .buy-now-btn:hover { filter: brightness(1.1); }
  .buy-now-btn:disabled { opacity: .5; }

  /* ── comparison card ── */
  .compare-wrap { display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); border-radius: 14px; border-bottom-left-radius: 4px; padding: 13px 15px; }
  .compare-title { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .4px; font-weight: 700; }
  .compare-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--surface-3); border-radius: 9px; padding: 10px 12px;
    border: 1px solid var(--border);
  }
  .compare-row.best { border-color: var(--accent); }
  .compare-left { display: flex; flex-direction: column; gap: 2px; }
  .compare-left .cname { font-size: 13px; font-weight: 600; }
  .compare-left .cmerchant { font-size: 11px; color: #aa66ff; font-weight: 700; }
  .compare-right { display: flex; align-items: center; gap: 8px; }
  .compare-right .cprice { font-size: 15px; font-weight: 800; }
  .best-tag { font-size: 9.5px; font-weight: 700; color: #06060a; background: var(--accent); padding: 2px 7px; border-radius: 5px; }

  /* ── order summary card ── */
  .order-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; border-bottom-left-radius: 4px; padding: 15px; min-width: 280px; }
  .order-card h4 { font-size: 13.5px; font-weight: 700; margin-bottom: 8px; }
  .order-line { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-dim); padding: 3px 0; }
  .order-total-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
  .order-total-row .lbl { font-size: 12.5px; color: var(--text-dim); }
  .order-total-row .val { font-size: 19px; font-weight: 800; color: var(--accent); font-family: 'JetBrains Mono', monospace; }
  .savings-line { font-size: 11.5px; color: var(--green); margin-top: 4px; }
  .pay-btn {
    margin-top: 12px; width: 100%; padding: 11px; border-radius: 9px; border: none;
    background: var(--accent); color: #06060a; font-weight: 700; font-size: 13.5px; transition: all .15s;
  }
  .pay-btn:hover:not(:disabled) { filter: brightness(1.1); box-shadow: 0 0 16px var(--accent-glow); }
  .pay-btn:disabled { opacity: .5; }
  .order-status-note { font-size: 11.5px; color: var(--red); margin-top: 8px; }

  /* ── payment status card ── */
  .payment-card { border-radius: 14px; border-bottom-left-radius: 4px; padding: 16px; min-width: 260px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .payment-card.success { background: linear-gradient(135deg,#0d1f17,#0d171f); border: 1px solid var(--accent); }
  .payment-card.failed { background: #1f0d0d; border: 1px solid var(--red); }
  .payment-icon { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .payment-card.success .payment-icon { background: var(--accent); color: #06060a; }
  .payment-card.failed .payment-icon { background: var(--red); color: #06060a; }
  .payment-card .ptitle { font-weight: 700; font-size: 14px; }
  .payment-card .pid { font-size: 11px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; word-break: break-all; }
  .retry-btn {
    margin-top: 4px; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--red);
    background: transparent; color: var(--red); font-size: 12.5px; font-weight: 600;
  }

  /* ══════════════ INPUT AREA ══════════════ */
  .input-bar { flex-shrink: 0; padding: 14px 16px 18px; display: flex; justify-content: center; }
  .input-inner {
    width: 100%; max-width: 720px; display: flex; align-items: flex-end; gap: 8px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 16px;
    padding: 8px 8px 8px 16px; transition: border-color .2s;
  }
  .input-inner:focus-within { border-color: var(--accent); }
  .input-inner textarea {
    flex: 1; background: none; border: none; outline: none; resize: none;
    color: var(--text); font-family: inherit; font-size: 14.5px; line-height: 1.5;
    max-height: 120px; padding: 8px 0;
  }
  .input-inner textarea::placeholder { color: var(--text-dimmer); }

  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px; border: none; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
    background: var(--surface-3); color: var(--text-dim); transition: all .15s;
  }
  .icon-btn:hover:not(:disabled) { color: var(--text); background: #2a2a3a; }
  .icon-btn.send { background: var(--accent); color: #06060a; }
  .icon-btn.send:hover:not(:disabled) { filter: brightness(1.1); }
  .icon-btn:disabled { opacity: .4; cursor: not-allowed; }
  .icon-btn.mic.listening {
    background: var(--red); color: #fff;
    animation: micPulse 1.1s infinite;
  }
  @keyframes micPulse {
    0% { box-shadow: 0 0 0 0 rgba(255,68,102,.6); }
    70% { box-shadow: 0 0 0 12px rgba(255,68,102,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,68,102,0); }
  }

  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 11px 18px; border-radius: 10px; font-size: 13px; z-index: 600; opacity: 0;
    transition: all .25s; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 600px) {
    .product-card { flex: 0 0 155px; }
    header { padding: 12px 14px; }
    .badge { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-block">
    <div class="logo-icon">A</div>
    <div class="logo-text">
      <div class="name-row"><span class="online-dot"></span>AgentPay</div>
      <div class="sub" id="storeCountText">Connecting to stores…</div>
    </div>
  </div>
  <div class="header-right">
    <span class="badge">RAZORPAY TEST MODE</span>
  </div>
</header>

<div class="chat-scroll" id="chatScroll">
  <div class="chat-col" id="chatCol">
    <div class="welcome" id="welcome">
      <div class="icon">🛍️</div>
      <h2>Hi, I'm AgentPay</h2>
      <p>Tell me what you're looking for and I'll find it, negotiate the best price, and check you out — right here in chat. Try "I want to buy a shirt" or just say hi.</p>
    </div>
  </div>
</div>

<div class="input-bar">
  <div class="input-inner">
    <textarea id="chatInput" rows="1" placeholder="Message AgentPay…"></textarea>
    <button class="icon-btn mic" id="micBtn" title="Voice input" onclick="toggleMic()">🎤</button>
    <button class="icon-btn send" id="sendBtn" title="Send" onclick="submitChat()">➤</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = window.location.origin;
let sessionId = null;
let razorpayKeyId = null;
let isRunning = false;

/* ═══════════════════════ INIT ═══════════════════════ */
async function init() {
  autosizeInput();
  loadStoreCount();
  loadConfig();
  initVoice();
  document.getElementById('chatInput').addEventListener('keydown', onChatKeydown);
  document.getElementById('chatInput').addEventListener('input', autosizeInput);
}

async function loadStoreCount() {
  try {
    const res = await fetch(`${API}/api/merchants`);
    const data = await res.json();
    document.getElementById('storeCountText').textContent = `Connected to ${data.total} store${data.total === 1 ? '' : 's'}`;
  } catch (e) {
    document.getElementById('storeCountText').textContent = 'Store connection unavailable';
  }
}

async function loadConfig() {
  try {
    const res = await fetch(`${API}/api/config`);
    const data = await res.json();
    razorpayKeyId = data.key_id;
  } catch (e) { /* checkout will show an error if this never loads */ }
}

function autosizeInput() {
  const el = document.getElementById('chatInput');
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function onChatKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitChat(); }
}

/* ═══════════════════════ CHAT CORE ═══════════════════════ */
function removeWelcome() {
  const w = document.getElementById('welcome');
  if (w) w.remove();
}

function addUserBubble(text) {
  removeWelcome();
  const col = document.getElementById('chatCol');
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `<div class="bubble-stack"><div class="bubble">${escapeHtml(text)}</div></div>`;
  col.appendChild(row);
  scrollToBottom();
}

function addTypingIndicator() {
  const col = document.getElementById('chatCol');
  const row = document.createElement('div');
  row.className = 'msg-row agent';
  row.id = 'typingRow';
  row.innerHTML = `<div class="avatar">A</div><div class="bubble-stack"><div class="bubble typing-bubble"><span></span><span></span><span></span></div></div>`;
  col.appendChild(row);
  scrollToBottom();
}

function removeTypingIndicator() {
  document.getElementById('typingRow')?.remove();
}

function scrollToBottom() {
  const scroller = document.getElementById('chatScroll');
  requestAnimationFrame(() => { scroller.scrollTop = scroller.scrollHeight; });
}

function escapeHtml(s) {
  const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML;
}

async function submitChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || isRunning) return;
  input.value = '';
  autosizeInput();
  await sendMessage(text);
}

async function sendMessage(text) {
  if (isRunning) return;
  isRunning = true;
  document.getElementById('sendBtn').disabled = true;

  if (!text.startsWith('__BUY_NOW__:')) addUserBubble(text);
  addTypingIndicator();

  try {
    const res = await fetch(`${API}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });
    const data = await res.json();
    sessionId = data.session_id;
    removeTypingIndicator();
    (data.messages || []).forEach(renderAgentMessage);
  } catch (e) {
    removeTypingIndicator();
    renderAgentMessage({ type: 'text', content: `Something went wrong: ${e.message}` });
  } finally {
    isRunning = false;
    document.getElementById('sendBtn').disabled = false;
  }
}

/* ═══════════════════════ RENDERING RICH MESSAGES ═══════════════════════ */
function agentRow(innerHtml) {
  removeWelcome();
  const col = document.getElementById('chatCol');
  const row = document.createElement('div');
  row.className = 'msg-row agent';
  row.innerHTML = `<div class="avatar">A</div><div class="bubble-stack">${innerHtml}</div>`;
  col.appendChild(row);
  scrollToBottom();
  return row;
}

function renderAgentMessage(msg) {
  const type = msg.type, content = msg.content;
  if (type === 'text') {
    agentRow(`<div class="bubble">${escapeHtml(content)}</div>`);
  } else if (type === 'options') {
    renderOptions(content);
  } else if (type === 'product_cards') {
    renderProductCards(content);
  } else if (type === 'comparison') {
    renderComparison(content);
  } else if (type === 'order_summary') {
    renderOrderSummary(content);
  } else if (type === 'payment_status') {
    renderPaymentStatus(content);
  }
}

function hueFor(name) {
  let h = 0;
  for (let i = 0; i < (name || '').length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  return h;
}

function renderOptions(content) {
  const row = agentRow(`
    <div class="options-card">
      <div class="q">${escapeHtml(content.question || '')}</div>
      <div class="options-row">
        ${(content.options || []).map(opt => `<button class="option-btn" onclick="pickOption(this, '${opt.replace(/'/g, "\\'")}')">${escapeHtml(opt)}</button>`).join('')}
      </div>
    </div>
  `);
}

function pickOption(btnEl, value) {
  const row = btnEl.closest('.options-row');
  row.querySelectorAll('.option-btn').forEach(b => { b.disabled = true; });
  btnEl.classList.add('picked');
  sendMessage(value);
}

function renderProductCards(products) {
  agentRow(`
    <div class="cards-scroll">
      ${products.map(p => productCardHtml(p)).join('')}
    </div>
  `);
}

function productCardHtml(p) {
  const escName = (p.name || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
  return `
    <div class="product-card">
      <div class="product-img" style="--hue:${hueFor(p.name)}">
        <img src="${p.image_url}" alt="${escName}" loading="lazy"
             onerror="this.style.display='none'; this.parentElement.classList.add('img-fallback')">
        <span class="img-fallback-text">${(p.name || '?').charAt(0)}</span>
        ${p.bulk_discount_pct ? `<span class="bulk-badge">Up to ${p.bulk_discount_pct}% off</span>` : ''}
      </div>
      <div class="product-body">
        <div class="product-merchant">${escapeHtml(p.merchant || '')}</div>
        <div class="product-name">${escapeHtml(p.name || '')}</div>
        <div class="product-price">₹${(p.price || 0).toLocaleString()}<span style="font-size:10.5px;color:var(--text-dim);font-weight:500"> /${p.unit || 'piece'}</span></div>
        <button class="buy-now-btn" onclick="buyNow('${p.id}', this)">Buy Now</button>
      </div>
    </div>
  `;
}

function buyNow(productId, btnEl) {
  btnEl.disabled = true;
  btnEl.textContent = 'Working…';
  sendMessage(`__BUY_NOW__:${productId}:1`);
}

function renderComparison(content) {
  const items = content.items || [];
  const cheapest = items.reduce((min, p) => (p.price < (min?.price ?? Infinity) ? p : min), null);
  agentRow(`
    <div class="compare-wrap">
      <div class="compare-title">Price Comparison</div>
      ${items.map(p => `
        <div class="compare-row ${p === cheapest ? 'best' : ''}">
          <div class="compare-left">
            <div class="cname">${escapeHtml(p.name)}</div>
            <div class="cmerchant">${escapeHtml(p.merchant)}</div>
          </div>
          <div class="compare-right">
            ${p === cheapest ? '<span class="best-tag">BEST PRICE</span>' : ''}
            <span class="cprice">₹${(p.price || 0).toLocaleString()}</span>
          </div>
        </div>
      `).join('')}
    </div>
  `);
}

function renderOrderSummary(content) {
  const failed = content.payment_status !== 'success' || !content.checkout;
  const rowId = 'order-' + Math.random().toString(36).slice(2, 9);
  const row = agentRow(`
    <div class="order-card" id="${rowId}">
      <h4>Order Summary — ${escapeHtml(content.merchant || '')}</h4>
      ${(content.items || []).map(it => `
        <div class="order-line"><span>${escapeHtml(it.name)} × ${it.quantity}</span><span>₹${(it.total || 0).toLocaleString()}</span></div>
      `).join('')}
      <div class="order-total-row">
        <span class="lbl">Total</span>
        <span class="val">₹${(content.total || 0).toLocaleString()}</span>
      </div>
      ${content.discount ? `<div class="savings-line">You saved ₹${content.discount.toLocaleString()} (${content.savings_pct}%) through negotiation</div>` : ''}
      ${failed
        ? `<div class="order-status-note">Couldn't create the payment order — please try again.</div>`
        : `<button class="pay-btn" onclick='payForOrder(${JSON.stringify(content).replace(/'/g, "&apos;")}, this)'>Pay with Razorpay</button>`
      }
    </div>
  `);
}

/* ═══════════════════════ RAZORPAY CHECKOUT ═══════════════════════ */
function payForOrder(orderSummary, btnEl) {
  if (!razorpayKeyId) { showToast('Payment isn\'t ready yet — try again in a second.'); return; }
  btnEl.disabled = true;
  btnEl.textContent = 'Opening Razorpay…';

  const checkout = orderSummary.checkout;
  const options = {
    key: razorpayKeyId,
    amount: checkout.amount,
    currency: checkout.currency,
    order_id: checkout.order_id,
    name: 'AgentPay Protocol',
    description: `AI Agent Commerce — ${orderSummary.merchant}`,
    prefill: { email: 'test@agentpay.com' },
    theme: { color: '#00d4aa' },
    handler: async function (response) {
      try {
        const verifyRes = await fetch(`${API}/api/payment/verify`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            razorpay_order_id: response.razorpay_order_id,
            razorpay_payment_id: response.razorpay_payment_id,
            razorpay_signature: response.razorpay_signature,
          }),
        });
        const verifyData = await verifyRes.json();
        if (verifyRes.ok && verifyData.verified) {
          renderPaymentStatus({ status: 'success', payment_id: response.razorpay_payment_id, order_id: checkout.order_id, amount: orderSummary.total });
        } else {
          renderPaymentStatus({ status: 'failed', error: 'Signature verification failed', orderSummary });
        }
      } catch (e) {
        renderPaymentStatus({ status: 'failed', error: e.message, orderSummary });
      }
      btnEl.textContent = 'Paid ✓';
    },
    modal: {
      ondismiss: function () {
        btnEl.disabled = false;
        btnEl.textContent = 'Pay with Razorpay';
      }
    }
  };

  const rzp = new Razorpay(options);
  rzp.on('payment.failed', function (response) {
    renderPaymentStatus({ status: 'failed', error: response.error?.description, orderSummary });
    btnEl.disabled = false;
    btnEl.textContent = 'Pay with Razorpay';
  });
  rzp.open();
}

function retryPayment(orderSummaryJson) {
  const orderSummary = JSON.parse(orderSummaryJson);
  const fakeBtn = document.createElement('button');
  payForOrder(orderSummary, fakeBtn);
}

function renderPaymentStatus(content) {
  if (content.status === 'success') {
    agentRow(`
      <div class="payment-card success">
        <div class="payment-icon">✓</div>
        <div class="ptitle">Payment Successful</div>
        <div class="pid">Payment ID: ${escapeHtml(content.payment_id || '')}</div>
        <div class="pid">Order ID: ${escapeHtml(content.order_id || '')}</div>
      </div>
    `);
  } else {
    agentRow(`
      <div class="payment-card failed">
        <div class="payment-icon">✕</div>
        <div class="ptitle">Payment Failed</div>
        <div class="pid">${escapeHtml(content.error || 'The payment could not be completed.')}</div>
        ${content.orderSummary ? `<button class="retry-btn" onclick='retryPayment(${JSON.stringify(JSON.stringify(content.orderSummary))})'>Retry Payment</button>` : ''}
      </div>
    `);
  }
}

/* ═══════════════════════ VOICE INPUT (Web Speech API) ═══════════════════════ */
let recognition = null;
let silenceTimer = null;

function initVoice() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById('micBtn');
  if (!SpeechRecognition) { micBtn.style.display = 'none'; return; }

  recognition = new SpeechRecognition();
  recognition.lang = 'en-IN';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onresult = (e) => {
    let transcript = '';
    for (let i = 0; i < e.results.length; i++) transcript += e.results[i][0].transcript;
    document.getElementById('chatInput').value = transcript;
    autosizeInput();
    resetSilenceTimer();
  };
  recognition.onend = () => {
    micBtn.classList.remove('listening');
    clearTimeout(silenceTimer);
    const text = document.getElementById('chatInput').value.trim();
    if (text) submitChat();
  };
  recognition.onerror = () => {
    micBtn.classList.remove('listening');
    clearTimeout(silenceTimer);
  };
}

function resetSilenceTimer() {
  clearTimeout(silenceTimer);
  silenceTimer = setTimeout(() => { if (recognition) recognition.stop(); }, 2000);
}

function toggleMic() {
  if (!recognition) { showToast('Voice input isn\'t supported in this browser.'); return; }
  const micBtn = document.getElementById('micBtn');
  if (micBtn.classList.contains('listening')) {
    recognition.stop();
  } else {
    document.getElementById('chatInput').value = '';
    try {
      recognition.start();
      micBtn.classList.add('listening');
      resetSilenceTimer();
    } catch (e) { /* already started */ }
  }
}

/* ═══════════════════════ MISC ═══════════════════════ */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

init();
</script>
